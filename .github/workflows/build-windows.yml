name: Build Windows Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag to attach assets to'
        required: true
        default: 'v1.0'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath SoulState-windows-x64.zip

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=1.0.0 windows\installer.iss

      - name: Upload assets to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          gh release upload "$TAG" SoulState-windows-x64.zip --clobber --repo "${{ github.repository }}"
          if [ -f "build/installer/SoulState-windows-x64-setup.exe" ]; then
            gh release upload "$TAG" build/installer/SoulState-windows-x64-setup.exe --clobber --repo "${{ github.repository }}"
          fi
