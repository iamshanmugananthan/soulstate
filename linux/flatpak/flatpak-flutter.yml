app-id: com.shanmugananthan.soulstate
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22
command: SoulState
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.Notifications
modules:
  - name: soulstate
    buildsystem: simple
    build-options:
      arch:
        x86_64:
          env:
            BUNDLE_PATH: build/linux/x64/release/bundle
        aarch64:
          env:
            BUNDLE_PATH: build/linux/arm64/release/bundle
      append-path: /usr/lib/sdk/llvm22/bin:/run/build/soulstate/flutter/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
      env:
        PUB_CACHE: /run/build/soulstate/.pub-cache
    build-commands:
      - flutter build linux --release --no-pub
      - install -D $BUNDLE_PATH/SoulState /app/bin/SoulState
      - cp -r $BUNDLE_PATH/lib /app/bin/lib
      - cp -r $BUNDLE_PATH/data /app/bin/data
      - install -Dm644 assets/icon.svg /app/share/icons/hicolor/scalable/apps/com.shanmugananthan.soulstate.svg
      - install -Dm644 linux/flatpak/com.shanmugananthan.soulstate.metainfo.xml -t /app/share/metainfo
      - install -Dm644 linux/flatpak/com.shanmugananthan.soulstate.desktop -t /app/share/applications
      - install -Dm644 LICENSE ADDITIONAL_TERMS.md -t /app/share/licenses/com.shanmugananthan.soulstate
    sources:
      - type: git
        url: https://github.com/iamshanmugananthan/soulstate.git
        tag: v1.0.0
      - type: git
        url: https://github.com/flutter/flutter.git
        tag: 3.41.9
        dest: flutter
